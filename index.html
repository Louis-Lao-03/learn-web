  <h1>从零建一个网页</h1> 
  <p>这门课教你用最小的工具，做出一个能给别人看的网页。</p>
  <h2>什么是HTML</h2>
  <p>HTML 是超文本标记语言，用来描述网页的结构和内容。它通过标题、段落、图片和链接等标签，把页面上的信息组织起来，告诉浏览器每一部分是什么、该怎样显示。</p>
  <p>网页本质上就是一份 HTML 文档。浏览器打开网页时，会读取其中的 HTML，再按标签把文字、图片和链接呈现出来。可以说，HTML 搭起了网页的骨架，是学习制作网页的第一步。</p>

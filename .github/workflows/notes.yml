name: Build notes index

on:
  push:
    branches: [main]
    paths:
      - 'notes/**'
      - 'tools/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild notes-data.js
        run: node tools/build-notes.mjs
      - name: Commit if changed
        run: |
          git config user.name "notes-bot"
          git config user.email "notes-bot@users.noreply.github.com"
          git add notes-data.js
          if git diff --staged --quiet; then
            echo "索引无变化"
          else
            git commit -m "chore: rebuild notes index"
            git push
          fi
